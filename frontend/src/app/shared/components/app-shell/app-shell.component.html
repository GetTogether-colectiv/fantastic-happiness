<div [class.shell]="showNavigation()">
  @if (showNavigation()) {
    <header class="top-bar">
      <app-main-nav />
      <a class="logo" routerLink="/discover" aria-label="Home">
        <img src="LOGO.svg" alt="Logo" />
      </a>
      <app-user-switcher />
    </header>
  }
  <main [class.content]="showNavigation()">
    <router-outlet />
  </main>
</div>
