<nav class="main-nav" aria-label="Main">
  <button
    type="button"
    class="burger"
    aria-controls="main-nav-links"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @if (menuOpen()) {
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      } @else {
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      }
    </svg>
  </button>

  <div id="main-nav-links" class="links" [class.open]="menuOpen()">
    <a routerLink="/discover" routerLinkActive="active" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
      </svg>
      <span>Discover</span>
    </a>
    <a routerLink="/swipe" routerLinkActive="active" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
      <span>Swipe</span>
    </a>
    <a routerLink="/map" routerLinkActive="active" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span>Map</span>
    </a>
    <a routerLink="/my-events" routerLinkActive="active" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span>My events</span>
    </a>
    <a
      routerLink="/events/new"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </svg>
      <span>New event</span>
    </a>
    <a routerLink="/profile" routerLinkActive="active" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>Profile</span>
    </a>
  </div>
</nav>
