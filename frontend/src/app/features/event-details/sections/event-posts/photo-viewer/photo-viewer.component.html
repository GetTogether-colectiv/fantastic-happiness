<div class="viewer">
  <button class="close" type="button" aria-label="Close photo" (click)="close()">✕</button>

  @if (hasPrevious()) {
    <button class="nav previous" type="button" aria-label="Previous photo" (click)="previous()">‹</button>
  }

  <img [src]="currentUrl()" [alt]="'Photo ' + (index() + 1) + ' of ' + photoUrls.length" />

  @if (hasNext()) {
    <button class="nav next" type="button" aria-label="Next photo" (click)="next()">›</button>
  }

  @if (photoUrls.length > 1) {
    <p class="counter" aria-live="polite">{{ index() + 1 }} / {{ photoUrls.length }}</p>
  }
</div>
