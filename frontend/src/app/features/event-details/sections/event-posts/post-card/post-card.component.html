<article>
  <header>
    <app-avatar [name]="post().authorName" [imageUrl]="post().authorAvatar" />
    <div class="author">
      <strong>{{ post().authorName }}</strong>
      <time [attr.datetime]="post().createdAt">{{ post().createdAt | date: 'mediumDate' }}</time>
    </div>
  </header>

  <app-star-rating [rating]="post().rating" />
  @if (post().text) {
    <p>{{ post().text }}</p>
  }
  @if (post().photoUrls.length > 0) {
    <ul class="photos">
      @for (url of post().photoUrls; track url) {
        <li>
          <button type="button" [attr.aria-label]="'Open photo ' + ($index + 1)" (click)="openPhoto($index)">
            <img [src]="url" alt="" loading="lazy" />
          </button>
        </li>
      }
    </ul>
  }
</article>
