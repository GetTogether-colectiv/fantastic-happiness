<article>
  <header>
    <app-avatar [name]="post().authorName" [imageUrl]="post().authorAvatar" />
    <div class="author">
      <strong>{{ post().authorName }}</strong>
      <time [attr.datetime]="post().createdAt">{{ post().createdAt | date: 'mediumDate' }}</time>
    </div>
  </header>

  <app-star-rating [rating]="post().rating" />
  @if (post().text) {
    <p>{{ post().text }}</p>
  }

  <button
    class="comments-toggle"
    type="button"
    [attr.aria-expanded]="commentsOpen()"
    (click)="commentsOpen.set(!commentsOpen())"
  >
    {{ commentCount() }} {{ commentCount() === 1 ? 'comment' : 'comments' }}
  </button>

  @if (commentsOpen()) {
    <app-post-comments [postId]="post().id" (countChange)="commentCount.set($event)" />
  }
</article>
