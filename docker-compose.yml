services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gettogether
      POSTGRES_USER: gettogether
      POSTGRES_PASSWORD: gettogether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gettogether"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
