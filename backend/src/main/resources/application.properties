spring.application.name=gettogether

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gettogether}
spring.datasource.username=${DB_USERNAME:gettogether}
spring.datasource.password=${DB_PASSWORD:gettogether}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

gettogether.cors.allowed-origins=http://localhost:4200
