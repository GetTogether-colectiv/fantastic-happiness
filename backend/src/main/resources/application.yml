spring:
  application:
    name: gettogether
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gettogether
    username: gettogether
    password: gettogether
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  uploads:
    dir: ./uploads

gettogether:
  cors:
    allowed-origins: http://localhost:4200
